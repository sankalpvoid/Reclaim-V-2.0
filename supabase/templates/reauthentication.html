<!doctype html><html><body style="margin:0;background:#0A0A0F;">
  <div style="margin:0;padding:32px 16px;background:#0A0A0F;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#F7F5FB;">
    <div style="max-width:560px;margin:0 auto;background:#121119;border:1px solid #292633;border-radius:20px;padding:32px;">
      <div style="font-size:18px;font-weight:700;margin-bottom:28px;">
        <span style="color:#A855F7;">◜</span>&nbsp; Reclaim
      </div>
      
      <h1 style="margin:0 0 14px;font-size:28px;line-height:1.15;letter-spacing:-0.03em;">Your verification code</h1>
      <p style="margin:0 0 18px;color:#C8C3D0;font-size:16px;line-height:1.65;">Use this code to verify a sensitive action in Reclaim.</p>
      <div style="display:inline-block;background:#1A1822;border:1px solid #34303F;border-radius:12px;padding:14px 20px;color:#F7F5FB;font-size:26px;font-weight:800;letter-spacing:.18em;">{{ .Token }}</div>
      <p style="margin:24px 0 0;color:#8F899B;font-size:13px;line-height:1.6;">If you did not request this code, you can ignore this email.</p>
      <div style="height:1px;background:#292633;margin:30px 0 20px;"></div>
      <p style="margin:0;color:#8F899B;font-size:12px;line-height:1.6;">
        Reclaim is a behavior-support and tracking product. This email relates to your Reclaim account.
      </p>
    </div>
  </div></body></html>
