name: Refresh Expo SDK 57 patch

on:
  push:
    branches:
      - phase-7-health-recovery

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message != 'chore: refresh Expo SDK 57 patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-7-health-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm install expo@~57.0.23
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "chore: refresh Expo SDK 57 patch"
          git push origin HEAD:phase-7-health-recovery
