name: Phase 15 align Expo dependencies

on:
  push:
    branches:
      - phase-15-accessibility-polish
    paths:
      - .github/workflows/phase15-align-expo-deps.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-15-accessibility-polish
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npx expo install --fix --npm
      - name: Commit aligned Expo dependencies
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: align Expo SDK 57 patch dependencies"
          git push origin HEAD:phase-15-accessibility-polish
