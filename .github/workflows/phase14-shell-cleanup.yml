name: Phase 14 shell cleanup

on:
  push:
    branches:
      - phase-14-navigation-shell

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-14-navigation-shell
      - name: Clean primary shell screens
        run: |
          python - <<'PY'
          from pathlib import Path

          community = Path('src/features/community/CommunityScreen.tsx')
          text = community.read_text()
          text = text.replace("import { router } from 'expo-router';\n", '')
          text = text.replace('          <BackButton />\n', '')
          text = text.replace('        <BackButton />\n\n', '')
          text = text.replace("\nfunction BackButton() {\n  return (\n    <Pressable accessibilityRole=\"button\" onPress={() => router.back()} style={styles.backButton}>\n      <AppText tone=\"secondary\">‹ Back</AppText>\n    </Pressable>\n  );\n}\n", '')
          text = text.replace("  backButton: { alignSelf: 'flex-start', paddingVertical: spacing.sm, paddingRight: spacing.md },\n", '')
          community.write_text(text)

          today = Path('src/features/today/TodayScreen.tsx')
          text = today.read_text()
          text = text.replace("import { Pressable, ScrollView, StyleSheet, View } from 'react-native';", "import { ScrollView, StyleSheet, View } from 'react-native';")
          text = text.replace("import { signOut } from '@/features/auth/authService';\n", '')
          text = text.replace("  const [signOutError, setSignOutError] = useState<string | null>(null);\n  const [isSigningOut, setIsSigningOut] = useState(false);\n", '')
          start = text.find('  async function handleSignOut() {')
          if start != -1:
            end = text.find('\n\n  return (', start)
            if end == -1:
              raise SystemExit('Could not find end of handleSignOut')
            text = text[:start] + text[end + 2:]
          footer = """        <View style={styles.footer}>\n          {signOutError ? <AppText tone=\"danger\">{signOutError}</AppText> : null}\n          <Pressable\n            accessibilityRole=\"button\"\n            disabled={isSigningOut}\n            onPress={() => void handleSignOut()}\n            style={styles.signOutButton}\n          >\n            <AppText tone=\"secondary\">{isSigningOut ? 'Signing out…' : 'Sign out'}</AppText>\n          </Pressable>\n        </View>\n"""
          text = text.replace(footer, '')
          text = text.replace("  footer: {\n    alignItems: 'flex-start',\n    gap: spacing.sm,\n    paddingTop: spacing.md,\n  },\n  signOutButton: {\n    paddingVertical: spacing.sm,\n    paddingRight: spacing.md,\n  },\n", '')
          today.write_text(text)
          PY
      - name: Commit cleanup when needed
        run: |
          if git diff --quiet; then
            echo "Shell cleanup already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/community/CommunityScreen.tsx src/features/today/TodayScreen.tsx
          git commit -m "refactor: finish primary navigation cleanup"
          git push
