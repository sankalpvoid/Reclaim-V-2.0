name: Phase 13 build properties refresh

on:
  push:
    branches:
      - phase-13-native-widgets

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-13-native-widgets
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install current project dependencies
        run: npm ci
      - name: Install build properties
        run: npx expo install expo-build-properties
      - name: Commit dependency metadata when needed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency metadata already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: add iOS scene support dependency"
          git push
