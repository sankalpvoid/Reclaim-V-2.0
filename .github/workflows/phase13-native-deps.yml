name: Phase 13 native dependency refresh

on:
  push:
    branches:
      - phase-13-native-widgets

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-13-native-widgets
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install widget and development build dependencies
        run: npx expo install expo-dev-client expo-widgets
      - name: Commit dependency metadata when needed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency metadata already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: add native widget dependencies"
          git push
