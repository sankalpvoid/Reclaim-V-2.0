name: Reclaim V2 CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22.14.0
        uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release configuration
        run: |
          node scripts/validate-release-config.mjs
          npx expo config --type public > /tmp/reclaim-expo-config.json

      - name: Check Expo project health
        run: npx --yes expo-doctor@1.20.4

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
