name: Reclaim V2 CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22.14.0
        uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
          cache: npm

      - name: Generate approved brand assets
        run: node scripts/generate-brand-assets.mjs

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate release configuration
        run: |
          node scripts/validate-release-config.mjs
          npx expo config --type public > /tmp/reclaim-expo-config.json

      - name: Check Expo project health
        run: npx --yes expo-doctor@1.20.4

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  persist-brand-assets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22.14.0
        uses: actions/setup-node@v5
        with:
          node-version: 22.14.0

      - name: Generate approved brand assets
        run: node scripts/generate-brand-assets.mjs

      - name: Commit generated brand assets
        run: |
          git add assets/branding/*.png
          if git diff --cached --quiet; then
            echo "Brand assets already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: generate approved Reclaim brand assets [skip ci]"
            git push
          fi
