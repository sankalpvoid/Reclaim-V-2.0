name: Phase 15 Expo patch updater

on:
  push:
    branches:
      - phase-15-accessibility-polish

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-15-accessibility-polish
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npx expo install expo-build-properties
      - name: Commit SDK patch when needed
        run: |
          if git diff --quiet package.json package-lock.json; then
            echo "Expo dependency already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: align Expo build properties patch"
          git push
